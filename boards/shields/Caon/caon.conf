# Disabled due to https://github.com/zmkfirmware/zmk/issues/2556
# Implement 1 wakeup source from GPIO as workarround
#
# Milliseconds of inactivity before entering deep sleep
# 900000ms (15 minutes)
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
#
# Enable deep sleep support
# CONFIG_ZMK_SLEEP=y 

# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Caon"

# SPI Enable
CONFIG_SPI=y

# Milliseconds of inactivity before entering idle state
# 30000ms (30 seconds)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Delay in ms between matrix row is activated and when the columns are read 
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=50
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_BUF_ACL_TX_COUNT=5
CONFIG_BT_L2CAP_TX_BUF_COUNT=5

# Encoders Enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Pointing Device/Mouse Emulation Enable
CONFIG_ZMK_POINTING=y

# Display
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Display MEMORY CONFIG
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y

# NICE OLED General Config
## NICE OLED WIDGETS
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=960
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_RAW_HID=n
CONFIG_NICE_OLED_WIDGET_RAW_HID_DRIVER=n

### NICE OLED WPM WIDGETS
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n

### NICE OLED WIDGETS HIDs
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA_ONLY_CAPSLOCK=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT_ONLY_CAPSLOCK=y

### NICE OLED Time WIDGETS
# CONFIG_NICE_OLED_WIDGET_RAW_HID_TIME=y
# CONFIG_NICE_OLED_WIDGET_RAW_HID_TIME_CUSTOM_X=0
# CONFIG_NICE_OLED_WIDGET_RAW_HID_TIME_CUSTOM_Y=74

## NICE OLED Disable sleep art
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=n
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=n

## NICE OLED Disable extra fonts if not using RAW HID
CONFIG_LV_FONT_MONTSERRAT_14=n
CONFIG_LV_FONT_MONTSERRAT_22=n

## NICE OLED SYMBOL (WINDOWS SYMBOL WAS USED)
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

## NICE OLED Speedometer WPM WIDGET positioning (SPEEDOMETER WAS NOT USED).
CONFIG_NICE_OLED_WIDGET_WPM_GAUGE_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_WPM_GAUGE_CUSTOM_Y=70
CONFIG_NICE_OLED_WIDGET_WPM_NEEDLE_CENTER_CUSTOM_X=12
CONFIG_NICE_OLED_WIDGET_WPM_NEEDLE_CENTER_CUSTOM_Y=90
CONFIG_NICE_OLED_WIDGET_WPM_LABEL_CUSTOM_X=10
CONFIG_NICE_OLED_WIDGET_WPM_LABEL_CUSTOM_Y=88

# EXPERIMENTAL, DELETE IF IT DOES SOMETHING
CONFIG_BT_OBSERVER=n
CONFIG_BT_BROADCASTER=n
CONFIG_BT_GATT_CLIENT=n
